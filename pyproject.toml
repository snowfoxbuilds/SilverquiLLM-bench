[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "silverquillm-bench"
version = "0.1.0"
description = "SilverquiLLM MTG game engine benchmark"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "requests",
    "pyyaml",
    "click",
    "jsonschema>=4.18",
    "referencing>=0.30",
    "pytest>=8",
]

[project.scripts]
silverquillm = "silverquillm.cli:main"
benchmark = "silverquillm.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    # Pinned: tests/test_ruff_phase_g_regression.py budgets Ruff findings per
    # rule, measured with this exact version. Bumping it means re-measuring.
    "ruff==0.16.1",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["silverquillm*"]

[tool.setuptools.package-data]
# The results-repo schema doc that `silverquillm results-init` writes.  (The
# job dir's input/prompt.md now comes from the production prompt renderer, so
# there are no bench-side task templates to package.)
silverquillm = ["results_repo_templates/*.md"]
"silverquillm.karn" = [
    "*.json",
    "grader_image/Dockerfile",
    "grader_image/requirements.*",
    "candidate_toolchain/requirements.*",
    "candidate_toolchain/wheels/*.whl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "tests.py"]
# importlib mode allows tests.py files in audited test subdirectories without
# conflicting with the top-level tests/ package name.
addopts = "--import-mode=importlib -m \"not integration\""
markers = ["integration: requires Docker daemon"]
timeout = 300

[tool.mypy]
python_version = "3.13"
strict = true
# `engine` and `cards` live under benchmarks/sos/workspace/ — put that on
# the mypy module search path so the unqualified names resolve.
mypy_path = "benchmarks/sos/workspace"
packages = ["engine", "cards"]
