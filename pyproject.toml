[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "silverquillm-bench"
version = "0.1.0"
description = "SilverquiLLM MTG game engine benchmark"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "pyyaml",
    "click",
    # TheOzolith's published packages: the bench CONSUMES its Run Contract
    # entry points (theozolith_worker.api) and its Candidate Bundle verifier
    # (theozolith_control.candidate — export, verify_bundle, the verified
    # build, over theozolith_nodedaemon's Dockerfile codegen and tree hash and
    # theozolith_knowledge's compiler) rather than reimplementing them, and
    # pins EVERY one of them to the EXACT immutable revision
    # docs/specs/BENCH-CONTRACT.md is vendored from (the packages are not on
    # PyPI and the-ozolith publishes no release tags).
    # silverquillm/contract_version.py states the same revision plus each
    # package's tree digest and the driver refuses any other;
    # tests/test_contract_pin.py keeps the sources in agreement. Re-sync the
    # vendored contract and vectors when moving this pin.
    "theozolith-worker @ git+https://github.com/snowfoxbuilds/the-ozolith.git@19118cae6dc4faf0543bd9bf18aa54621c971358#subdirectory=worker",
    "theozolith-control @ git+https://github.com/snowfoxbuilds/the-ozolith.git@19118cae6dc4faf0543bd9bf18aa54621c971358#subdirectory=control",
    "theozolith-nodedaemon @ git+https://github.com/snowfoxbuilds/the-ozolith.git@19118cae6dc4faf0543bd9bf18aa54621c971358#subdirectory=nodedaemon",
    "theozolith-knowledge @ git+https://github.com/snowfoxbuilds/the-ozolith.git@19118cae6dc4faf0543bd9bf18aa54621c971358#subdirectory=knowledge",
]

[project.scripts]
silverquillm = "silverquillm.cli:main"
benchmark = "silverquillm.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    # Pinned: tests/test_ruff_phase_g_regression.py budgets Ruff findings per
    # rule, measured with this exact version. Bumping it means re-measuring.
    "ruff==0.16.1",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["silverquillm*"]

[tool.setuptools.package-data]
# The results-repo schema doc that `silverquillm results-init` writes.  (The
# job dir's input/prompt.md now comes from the production prompt renderer, so
# there are no bench-side task templates to package.)
silverquillm = ["results_repo_templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "tests.py"]
# importlib mode allows tests.py files in audited test subdirectories without
# conflicting with the top-level tests/ package name.
addopts = "--import-mode=importlib -m \"not integration\""
markers = ["integration: requires Docker daemon"]
timeout = 300

[tool.mypy]
python_version = "3.12"
strict = true
# `engine` and `cards` live under benchmarks/sos/workspace/ — put that on
# the mypy module search path so the unqualified names resolve.
mypy_path = "benchmarks/sos/workspace"
packages = ["engine", "cards"]
