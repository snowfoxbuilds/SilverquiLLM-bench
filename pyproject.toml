[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "silverquillm-bench"
version = "0.1.0"
description = "SilverquiLLM MTG game engine benchmark"
license = "GPL-2.0-only"
requires-python = ">=3.12"
dependencies = [
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",

]

[tool.setuptools.packages.find]
include = ["engine*", "cards*"]

[tool.setuptools.package-data]
engine = ["py.typed"]
cards = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["engine", "cards"]
