[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "silverquillm-bench"
version = "0.1.0"
description = "SilverquiLLM MTG game engine benchmark"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "pyyaml",
    "click",
]

[project.scripts]
silverquillm = "silverquillm.cli:main"
benchmark = "silverquillm.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    # Pinned: tests/test_ruff_phase_g_regression.py budgets Ruff findings per
    # rule, measured with this exact version. Bumping it means re-measuring.
    "ruff==0.16.1",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["silverquillm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "tests.py"]
# importlib mode allows tests.py files in audited test subdirectories without
# conflicting with the top-level tests/ package name.
addopts = "--import-mode=importlib -m \"not integration\""
markers = ["integration: requires Docker daemon"]
timeout = 300

[tool.mypy]
python_version = "3.12"
strict = true
# `engine` and `cards` live under benchmarks/sos/workspace/ — put that on
# the mypy module search path so the unqualified names resolve.
mypy_path = "benchmarks/sos/workspace"
packages = ["engine", "cards"]
