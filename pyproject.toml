[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "silverquillm-bench"
version = "0.1.0"
description = "SilverquiLLM MTG game engine benchmark"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "pyyaml",
    "click",
]

[project.scripts]
silverquillm = "silverquillm.cli:main"
benchmark = "silverquillm.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "ruff",
    "mypy",

]

[tool.setuptools.packages.find]
include = ["engine*", "cards*", "silverquillm*", "benchmarks*"]

[tool.setuptools.package-data]
engine = ["py.typed"]
cards = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "tests.py"]
# importlib mode allows tests.py files in audited test subdirectories without
# conflicting with the top-level tests/ package name.
addopts = "--import-mode=importlib"
markers = [
    "integration: requires Docker + local model server",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["engine", "cards"]
