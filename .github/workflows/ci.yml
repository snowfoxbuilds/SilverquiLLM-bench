name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python 3.13)
    # The runner is a developer host and the repository is public: fork
    # pull requests must never execute on it.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Create the Python 3.13 environment
        run: |
          uv venv --python 3.13 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Installs the exact the-ozolith revision pyproject.toml pins for every
      # package the bench consumes (git direct references, so each install
      # records the commit and tests/test_contract_pin.py can prove it), plus
      # the dev extra (pytest, the pinned ruff the finding-budget test
      # measures with).
      - name: Install
        run: |
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Show the installed contract pin
        run: |
          python - <<'EOF'
          from silverquillm import contract_version as cv
          for name, dist in cv.installed_contract().items():
              print(name, dist)
          print("support errors:", cv.support_errors())
          EOF

      - name: Test
        run: python -m pytest tests/ -q
