name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clear-outcome:
    # A new head makes the previous test outcome stale, so both labels come off
    # before the tests start; the test-outcome job labels this head when they end.
    # It runs on a GitHub-hosted runner, so a push loses its stale label within
    # seconds even while another pull request's tests hold the self-hosted runner.
    # It only calls the GitHub API and never checks out pull request code; a fork's
    # token is read-only and cannot label, so fork pull requests skip it.
    name: Clear the test outcome
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            for (const name of ['tests-passed', 'tests-failed']) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name });
                core.info(`${name}: removed`);
              } catch (error) {
                if (error.status !== 404) throw error;
                core.info(`${name}: absent`);
              }
            }

  test:
    name: pytest (Python 3.13)
    needs: clear-outcome
    # Runs when clear-outcome succeeded, or was skipped on a push to main.
    # The runner is a developer host and the repository is public: fork
    # pull requests must never execute on it.
    if: >-
      !cancelled() && needs.clear-outcome.result != 'failure'
      && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Create the Python 3.13 environment
        run: |
          uv venv --python 3.13 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # The dev extra carries pytest and the pinned ruff the finding-budget
      # test measures with; the runtime needs no Ozolith package (ADR-014).
      - name: Install
        run: |
          uv pip install --python .venv/bin/python -e ".[dev]"

      # A job-private basetemp: the host's own pytest sessions share
      # /tmp/pytest-of-<user> and prune each other's numbered directories.
      # It stays under the system temp dir, which redaction tests expect.
      - name: Test
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          python -m pytest tests/ -q --basetemp "$tmp/pytest"

  test-py314:
    # Grading runs on the candidate's own Python minor version, so SilverquiLLM,
    # which runs inside each pinned grader, is tested on every graded version.
    # The login-plugin tests skip here: the plugin host stays on 3.13.
    # It runs after merge only: a pull request is gated on 3.13 alone, which
    # halves its time on the one runner, and a 3.14-only break fails this job on main.
    name: pytest (Python 3.14)
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64]
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Create the Python 3.14 environment
        run: |
          uv venv --python 3.14 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install
        run: |
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Test
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          python -m pytest tests/ -q --basetemp "$tmp/pytest"

  test-outcome:
    # CI owns the test outcome labels: a Reviewer takes a pull request once it
    # carries `request-review` and `tests-passed`, and nothing but this job adds
    # `tests-passed` or `tests-failed`. A job that timed out or was cancelled on
    # its own counts as failed; a run cancelled whole (a newer push) labels nothing.
    # Like clear-outcome it only calls the GitHub API, so it runs GitHub-hosted.
    name: Label the test outcome
    needs: test
    if: >-
      !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const tested = context.payload.pull_request.head.sha;

            // A push after this run started makes its outcome stale: the newer run
            // clears the labels and labels the new head.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.head.sha !== tested) {
              core.notice(`Head moved from ${tested} to ${pr.head.sha}; not labelling a stale result.`);
              return;
            }

            const passed = Object.values(JSON.parse(process.env.RESULTS)).every((job) => job.result === 'success');
            const [add, remove] = passed ? ['tests-passed', 'tests-failed'] : ['tests-failed', 'tests-passed'];

            if (!passed) {
              const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                owner, repo, run_id: context.runId, attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT),
              });
              const lines = [`Tests failed on \`${tested.slice(0, 12)}\`: [CI run](${run}).`, ''];
              for (const job of jobs.filter((j) => ['failure', 'cancelled', 'timed_out'].includes(j.conclusion))) {
                const steps = (job.steps || []).filter((s) => ['failure', 'cancelled', 'timed_out'].includes(s.conclusion));
                lines.push(`- **${job.name}**: ${job.conclusion}${steps.length ? ` at ${steps.map((s) => `\`${s.name}\``).join(', ')}` : ''}`);
                let log = '';
                try {
                  const response = await github.rest.actions.downloadJobLogsForWorkflowRun({ owner, repo, job_id: job.id });
                  log = typeof response.data === 'string' ? response.data : Buffer.from(response.data).toString();
                  if (!log && response.url) log = await (await fetch(response.url)).text();
                } catch (error) {
                  core.warning(`Could not read the log of ${job.name}: ${error.message}`);
                }
                const text = log.split('\n').map((line) => line.replace(/^\S+Z /, ''));
                const failing = text.filter((line) => /^(FAILED|ERROR) /.test(line));
                for (const line of failing.slice(0, 25)) lines.push(`  - \`${line.slice(0, 300)}\``);
                if (failing.length > 25) lines.push(`  - … and ${failing.length - 25} more`);
                const summary = text.filter((line) => /^=*\s*\d+ (failed|passed|errors?)\b/.test(line)).pop();
                if (summary) lines.push(`  - pytest: \`${summary.replace(/=/g, '').trim()}\``);
              }
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body: lines.join('\n') });
            }

            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: remove });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [add] });
            core.info(`${number}: ${add}`);
