name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Installs the exact theozolith-worker revision pyproject.toml pins (a
      # git direct reference, so the install records the commit and
      # tests/test_contract_pin.py can prove it), plus the dev extra (pytest,
      # the pinned ruff the finding-budget test measures with).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show the installed contract pin
        run: |
          python - <<'EOF'
          from silverquillm import contract_version as cv
          print(cv.installed_worker())
          print("support errors:", cv.support_errors())
          EOF

      - name: Test
        run: python -m pytest tests/ -q
